# Loads the schema + seeds into SurrealDB via its HTTP /import endpoint.
# Requires the `agent-identity-schema` ConfigMap (create it from the repo with
# deploy/k8s/create-schema-configmap.sh — it holds surreal/schema + surreal/seeds).
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
  namespace: agent-identity
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: schema-load
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: curlimages/curl:8.10.1
          env:
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: agent-identity-secrets
                  key: SURREAL_PASS
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for surrealdb..."
              until curl -sf http://surrealdb:8000/health; do sleep 2; done
              echo "surrealdb ready; importing schema + seeds"
              for f in agent_identity agent_lifecycle agent_did agent_graph \
                       agent_knowledge_graph access_review agent_economy \
                       agent_identity.seed agent_lifecycle.seed agent_graph.seed; do
                echo "importing $f.surql"
                curl -sf -X POST "http://surrealdb:8000/import" \
                  -u "root:$SURREAL_PASS" \
                  -H "surreal-ns: agent_identity" \
                  -H "surreal-db: dev" \
                  --data-binary "@/schema/$f.surql"
              done
              echo "schema + seeds loaded"
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: agent-identity-schema
