apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surrealdb-data
  namespace: agent-identity
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: agent-identity
  labels:
    app: surrealdb
spec:
  replicas: 1
  strategy:
    type: Recreate            # single writer over a RWO volume
  selector:
    matchLabels:
      app: surrealdb
  template:
    metadata:
      labels:
        app: surrealdb
    spec:
      securityContext:
        fsGroup: 1000          # so the mounted volume is writable
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:latest
          args:
            - "start"
            - "--user"
            - "root"
            - "--pass"
            - "$(SURREAL_PASS)"
            - "--bind"
            - "0.0.0.0:8000"
            - "rocksdb:/data/agent.db"
          env:
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: agent-identity-secrets
                  key: SURREAL_PASS
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surrealdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: agent-identity
spec:
  selector:
    app: surrealdb
  ports:
    - port: 8000
      targetPort: 8000
      name: http
