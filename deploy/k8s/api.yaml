apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-identity-api
  namespace: agent-identity
  labels:
    app: agent-identity-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-identity-api
  template:
    metadata:
      labels:
        app: agent-identity-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Build & push from apps/api/Dockerfile, then set your registry here.
          image: ghcr.io/agennext/agent-identity-api:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: agent-identity-config
            - secretRef:
                name: agent-identity-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-identity-api
  namespace: agent-identity
spec:
  selector:
    app: agent-identity-api
  ports:
    - port: 80
      targetPort: 3000
      name: http
