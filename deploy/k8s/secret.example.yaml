# Copy to secret.yaml, set real values, and apply BEFORE `kubectl apply -k`.
# Do NOT commit real secrets. In production use a sealed-secret / external secret store.
apiVersion: v1
kind: Secret
metadata:
  name: agent-identity-secrets
  namespace: agent-identity
type: Opaque
stringData:
  # SurrealDB root password (used by SurrealDB, the schema-load Job, and the API).
  SURREAL_PASS: "change-me-strong-password"
  # HS256 signing secret for API JWTs (32+ random bytes: openssl rand -hex 32).
  JWT_SECRET: "change-me-32-byte-random-value"
